# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver
#   gem install pg
#
# Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: felipe

development:
  <<: *default
  database: amparo_saude_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: amparo_saude_test

# On Render, a single managed Postgres instance is linked to the web service and
# exposed as the DATABASE_URL env var. solid_queue/solid_cache/solid_cable each
# keep their own tables (via their own migrations_paths) but live in that same
# database — there's no separate physical database per connection here.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate
